# ===== PROD PROFILE =====

# MySQL DataSource - production
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:parking_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA/Hibernate - strict for production
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false

# Logging - minimal, only errors and warnings
logging.level.root=WARN
logging.level.esiag.back=INFO
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=OFF
logging.level.org.springframework=WARN
logging.level.org.springframework.security=WARN
logging.level.com.zaxxer.hikari=ERROR

# Server port
server.port=8080
