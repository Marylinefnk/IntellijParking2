# PROD PROFILE

# MySQL DataSource - production
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:172.31.249.216}:${DB_PORT:3306}/${DB_NAME:test_tatiana_db}
spring.datasource.username=${DB_USERNAME:intellijP}
spring.datasource.password=${DB_PASSWORD:toto}

# JPA/Hibernate
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false

# Logging pour les ereurs
logging.level.root=WARN
logging.level.esiag.back=INFO
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=OFF
logging.level.org.springframework=WARN
logging.level.org.springframework.security=WARN
logging.level.com.zaxxer.hikari=ERROR

# Server port
server.port=8080
